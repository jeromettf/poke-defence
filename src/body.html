<div class="app">
  <div class="stage" id="stage">
    <canvas id="cv" aria-label="전장. 포켓몬을 눌러 고르고, 같은 포켓몬 위로 끌어다 놓으면 진화합니다."></canvas>
  </div>

  <header class="hud" id="hud">
    <div class="hud-row">
      <div class="plate wave" id="wave"><small>웨이브</small><b>0</b><i>/40</i></div>
      <div class="plate foes" id="foes" title="필드의 적. 한도를 넘으면 패배">
        <svg class="foe-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c4.4 0 8 3.3 8 7.6 0 2.6-1.4 4.4-3 5.5V20l-2.2-1.5L12 20l-2.8-1.5L7 20v-3.9c-1.6-1.1-3-2.9-3-5.5C4 6.3 7.6 3 12 3zm-3.2 6.5a1.8 1.8 0 1 0 0 3.6 1.8 1.8 0 0 0 0-3.6zm6.4 0a1.8 1.8 0 1 0 0 3.6 1.8 1.8 0 0 0 0-3.6z"/></svg>
        <div class="foe-main"><b id="fcount">0<i>/60</i></b><div class="gauge" id="fbarw"><i id="fbar"></i></div></div>
      </div>
      <div class="plate coin" id="coins">0</div>
    </div>
    <div class="hud-row sub">
      <div class="tline" id="tline"><i id="tbar"></i></div><span class="tsec" id="tsec">0초</span>
      <button class="gymchip" id="gymline" hidden></button>
    </div>
  </header>

  <button class="entry" id="entry" hidden></button>
  <div class="bossbar" id="bossbar" hidden><span class="bn" id="bbn"></span><div class="hp"><i id="bbh"></i></div><span class="bt" id="bbt"></span></div>
  <div class="toast" id="toast" data-off></div>
  <div class="radial" id="radial" hidden></div>

  <div class="dockbar" id="dockbar">
    <div class="controls">
      <button class="kbtn" id="speed" aria-label="속도">1×</button>
      <button class="kbtn" id="info" aria-pressed="false" aria-label="사거리와 효과 보기"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12zm10-3a3 3 0 1 0 0 6 3 3 0 0 0 0-6z" fill-rule="evenodd"/></svg></button>
      <button class="ball" id="summon"><span class="ball-band"><span class="ball-btn"></span></span><span class="ball-txt">소환</span><b class="ball-cost" id="cost">20</b></button>
      <button class="kbtn" id="pause" aria-label="멈춤"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
      <button class="kbtn" id="menuBtn" aria-label="메뉴"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="2.8" rx="1.4"/><rect x="4" y="10.6" width="16" height="2.8" rx="1.4"/><rect x="4" y="16.2" width="16" height="2.8" rx="1.4"/></svg></button>
    </div>
    <div class="syn" id="syn"></div>
    <div class="ups" id="ups"></div>
  </div>

  <section class="panel sheetcard" id="panel" aria-live="polite" hidden></section>
  <div class="tip" id="tip" hidden></div>
</div>

<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div class="modal top" id="layer" hidden><div class="sheet" id="lsheet"></div></div>
