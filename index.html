<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>포켓몬 랜덤 디펜스</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#d7392f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preload" href="fonts/plex-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/bhs-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/plex-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/game.css?v=ca7e1092">
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <canvas id="cv" aria-label="전장. 포켓몬을 눌러 고르고, 같은 포켓몬 위로 끌어다 놓으면 진화합니다."></canvas>
  </div>

  <header class="hud" id="hud">
    <div class="hud-row">
      <div class="plate wave" id="wave"><small>웨이브</small><b>0</b><i>/40</i></div>
      <div class="plate foes" id="foes" title="필드의 적. 한도를 넘으면 패배">
        <svg class="foe-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c4.4 0 8 3.3 8 7.6 0 2.6-1.4 4.4-3 5.5V20l-2.2-1.5L12 20l-2.8-1.5L7 20v-3.9c-1.6-1.1-3-2.9-3-5.5C4 6.3 7.6 3 12 3zm-3.2 6.5a1.8 1.8 0 1 0 0 3.6 1.8 1.8 0 0 0 0-3.6zm6.4 0a1.8 1.8 0 1 0 0 3.6 1.8 1.8 0 0 0 0-3.6z"/></svg>
        <div class="foe-main"><b id="fcount">0<i>/60</i></b><div class="gauge" id="fbarw"><i id="fbar"></i></div></div>
      </div>
      <div class="plate coin" id="coins">0</div>
    </div>
    <div class="hud-row sub">
      <button class="prog" id="prog" aria-label="웨이브 진행과 다음 관장"><span class="ptrack" id="tline"><i id="tbar"></i></span><span class="pgym" id="pgym" hidden></span><span class="tsec" id="tsec">0초</span></button>
      <button class="hico mis" id="mchip" aria-label="미션" hidden></button>
      <button class="hico wild" id="wildBtn" aria-label="야생 강적" hidden></button>
      <div class="news" id="toast" data-off></div>
    </div>
  </header>

  <button class="entry" id="entry" hidden></button>
  <button class="early" id="early" hidden></button>
  <div class="intro" id="intro" hidden></div>
  <div class="bossbar" id="bossbar" hidden><span class="bn" id="bbn"></span><div class="hp"><i id="bbh"></i></div><span class="bt" id="bbt"></span></div>
  <div class="radial" id="radial" hidden></div>

  <div class="dockbar" id="dockbar">
    <div class="controls">
      <button class="kbtn" id="speed" aria-label="속도">1×</button>
      <button class="kbtn catch" id="catch" aria-label="몬스터볼 던지기"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 1 8.9 7.6h-5.3a3.7 3.7 0 0 0-7.2 0H3.1A9 9 0 0 1 12 3z" fill="#ff5a4a"/><path d="M3.1 13.4h5.3a3.7 3.7 0 0 0 7.2 0h5.3A9 9 0 0 1 3.1 13.4z" fill="#fff"/><circle cx="12" cy="12" r="2.2" fill="#fff"/></svg><b id="ballN">3</b></button>
      <button class="ball" id="summon"><span class="ball-band"><span class="ball-btn"></span></span><span class="ball-txt">소환</span><b class="ball-cost" id="cost">20</b></button>
      <button class="kbtn luck" id="luck" aria-label="운 뽑기">운</button>
      <button class="kbtn" id="menuBtn" aria-label="메뉴"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="2.8" rx="1.4"/><rect x="4" y="10.6" width="16" height="2.8" rx="1.4"/><rect x="4" y="16.2" width="16" height="2.8" rx="1.4"/></svg></button>
    </div>
    <div class="syn" id="syn"></div>
    <div class="ups" id="ups"></div>
  </div>

  <section class="panel sheetcard" id="panel" aria-live="polite" hidden></section>
  <div class="tip" id="tip" hidden></div>
  <div class="oak" id="oak" hidden></div>
  <div class="spot" id="spot" hidden><div class="hole" id="spotHole"></div><div class="finger" id="spotFinger" hidden></div><div class="bub" id="spotBub"></div></div>
</div>

<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div class="modal top" id="layer" hidden><div class="sheet" id="lsheet"></div></div>
<div class="loading" id="loading"><div class="logo">포켓몬<br>랜덤 디펜스</div><div class="lbar"><i id="lbar"></i></div><p>스프라이트 불러오는 중</p></div>
<script src="js/sprites.js?v=701f2140"></script>
<script src="js/data.js?v=25cd5bd7"></script>
<script src="js/regions.js?v=91138f46"></script>
<script src="js/core.js?v=1581389d"></script>
<script src="js/skills.js?v=b94ab2b2"></script>
<script src="js/content.js?v=6fdb33ef"></script>
<script src="js/ui.js?v=3f2b7d15"></script>
<script src="js/meta.js?v=ba23a255"></script>
<script src="js/log.js?v=c507bd1d"></script>
<script src="js/tutorial.js?v=71ee5aa6"></script>
<script src="js/render.js?v=06fa334a"></script>
<script src="js/scene.js?v=77ed22ae"></script>
<script src="js/main.js?v=5668301e"></script>
<script>if('serviceWorker' in navigator&&isSecureContext)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body>
</html>
