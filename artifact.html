<title>포켓몬 랜덤 디펜스</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/game.css">

<div class="app">
  <header class="hud">
    <div class="hud-row">
      <div class="pill"><span class="wave" id="wave">W <span class="num">0</span><small>/40</small></span></div>
      <div class="bar tbar" title="웨이브 남은 시간"><i id="tbar"></i></div>
      <div class="pill coins" id="coins">0</div>
      <button class="ibtn" id="menuBtn" aria-label="메뉴"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="2.6" rx="1.3"/><rect x="4" y="10.7" width="16" height="2.6" rx="1.3"/><rect x="4" y="16.4" width="16" height="2.6" rx="1.3"/></svg></button>
    </div>
    <div class="hud-row">
      <div class="pill fieldpill"><span>필드 <span class="num" id="fcount">0/60</span></span><div class="bar field" id="fbarw"><i id="fbar"></i></div></div>
      <div class="forecast" id="forecast"></div>
    </div>
  </header>

  <div class="stage" id="stage">
    <div class="cvwrap" id="cvwrap">
      <canvas id="cv" aria-label="전장. 포켓몬을 눌러 고르고, 같은 포켓몬 위로 끌어다 놓으면 진화합니다."></canvas>
      <div class="bossbar" id="bossbar" hidden><span id="bbn"></span><div class="bar"><i id="bbh"></i></div><span class="num" id="bbt"></span></div>
      <div class="toast" id="toast" data-off></div>
    </div>
  </div>

  <div class="dock">
    <section class="syn" id="syn"></section>
    <div class="controls">
      <button class="gbtn summon" id="summon">소환 <span class="num" id="cost">20</span></button>
      <button class="gbtn sq" id="speed" aria-label="속도">1×</button>
      <button class="gbtn sq" id="pause" aria-label="멈춤"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
      <button class="gbtn sq" id="info" aria-pressed="false" aria-label="정보 보기"><svg viewBox="0 0 24 24"><circle cx="12" cy="6.5" r="2"/><rect x="10.2" y="10" width="3.6" height="9" rx="1.2"/></svg></button>
    </div>
    <div class="ups" id="ups"></div>
  </div>

  <section class="panel dlg" id="panel" aria-live="polite" hidden></section>
</div>

<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div class="modal top" id="layer" hidden><div class="sheet" id="lsheet"></div></div>
<div class="loading" id="loading"><div class="logo">포켓몬<br>랜덤 디펜스</div><div class="lbar"><i id="lbar"></i></div><p>스프라이트 불러오는 중</p></div>
<script src="js/sprites.js"></script>
<script src="js/data.js"></script>
<script src="js/regions.js"></script>
<script src="js/core.js"></script>
<script src="js/skills.js"></script>
<script src="js/ui.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
